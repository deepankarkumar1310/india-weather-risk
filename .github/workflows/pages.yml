name: Deploy site

on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", ".github/workflows/pages.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # pick up the snapshot the refresh job just pushed
      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp -r web/* _site/
          cp data/districts.geojson _site/data/
          if [ -f data/latest.json ]; then cp data/latest.json _site/data/; else echo "No snapshot yet: run the 'Refresh forecast' workflow first"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
