<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>India Weather Risk</title>
  <meta name="description" content="7-day flood and heatwave risk for every district in India, updated daily.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f08c3a'/%3E%3Cpath d='M16 7c4 6 6 9 6 12a6 6 0 0 1-12 0c0-3 2-6 6-12z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="Map of India coloured by district risk"></div>

  <aside class="panel" id="panel">
    <header class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>India Weather Risk</h1>
        <p class="muted" id="updated">Loading forecast…</p>
      </div>
      <button class="icon-btn" id="theme" title="Toggle light/dark" aria-label="Toggle light or dark theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </header>

    <div class="controls">
      <div class="seg" role="tablist" aria-label="Hazard">
        <button role="tab" data-hazard="overall" aria-selected="true">Overall</button>
        <button role="tab" data-hazard="flood" aria-selected="false">Flood</button>
        <button role="tab" data-hazard="heat" aria-selected="false">Heat</button>
      </div>
      <div class="days" id="days" aria-label="Forecast day"></div>
      <div class="search">
        <input id="search" list="district-list" placeholder="Search a district…" autocomplete="off" aria-label="Search a district">
        <datalist id="district-list"></datalist>
      </div>
    </div>

    <section class="stats" id="stats"></section>

    <section class="top">
      <h2 id="top-title">Highest risk</h2>
      <ol id="top-list"></ol>
    </section>

    <footer class="credits muted">
      Weather: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0) ·
      Normals: IMD 1991–2020 · Vulnerability: NITI Aayog CVI 2021 · Boundaries: DataMeet 2011 ·
      <a href="https://github.com/deepankarkumar1310/india-weather-risk" target="_blank" rel="noopener">Source</a> ·
      <a href="https://github.com/deepankarkumar1310/india-weather-risk/blob/main/docs/METHODOLOGY.md" target="_blank" rel="noopener">Methodology</a>
    </footer>
  </aside>

  <section class="detail" id="detail" hidden aria-live="polite">
    <button class="icon-btn close" id="close" aria-label="Close district details">✕</button>
    <div id="detail-body"></div>
  </section>

  <div class="legend" id="legend"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
